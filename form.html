<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            text-align: center;
        }
        form {
            width: 300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 10px;
        }
        form input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        form input:last-child {
            margin-bottom: 20px;
        }
        form input:focus {
            outline: none;
            border-color: #000;
        }
        form button {
            width: 100%;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #000;
        }
        form button:hover {
            color: #000;    
            background-color: #fff;
            border: 1.5px solid #000;
        }
    </style>
  <body>
    <main>
      <h1>Form</h1>
      <form>
        <input type="text" id="nama_depan" placeholder="Nama Depan" required />
        <input type="text" id="nama_belakang" placeholder="Nama Belakang" required />
        <button type="submit">Submit</button>
      </form>
    </main>
    <script src="form.js"></script>
  </body>
</html>
